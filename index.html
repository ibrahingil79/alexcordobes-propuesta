<style>
body{margin:0;background:#2A292E}
a{color:inherit}
button{font:inherit}
.pg{animation:pgIn .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.kb{animation:kb 14s cubic-bezier(.2,.6,.2,1) both}
@keyframes kb{from{transform:scale(1.18)}to{transform:scale(1)}}
.ln{display:block;overflow:hidden;padding-bottom:.06em}
.ln>span{display:block;animation:lnUp 1.2s cubic-bezier(.2,.75,.1,1) both}
@keyframes lnUp{from{transform:translateY(110%)}to{transform:none}}
.fd{animation:fd 1.4s ease both}
@keyframes fd{from{opacity:0}to{opacity:1}}
.cue{animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@supports (animation-timeline: view()){
.rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 70%}
.px{animation:px linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
.hdr{animation:hdr linear both;animation-timeline:scroll(root);animation-range:0 320px}
}
@supports not (animation-timeline: scroll()){.hdr{background:rgba(31,30,34,.94) !important}}
@keyframes rv{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
@keyframes px{from{transform:translateY(-7%) scale(1.16)}to{transform:translateY(7%) scale(1.16)}}
@keyframes hdr{from{background:rgba(31,30,34,0);backdrop-filter:blur(0)}to{background:rgba(31,30,34,.9);backdrop-filter:blur(10px)}}
.card .im{transition:transform 1.4s cubic-bezier(.2,.7,.2,1),opacity .8s ease}
.card:hover .im,.card:focus-visible .im{transform:scale(1.07)}
.card .im2{opacity:0}
.card:hover .im2,.card:focus-visible .im2{opacity:1}
.card .go{transition:letter-spacing .5s ease,color .4s ease}
.card:hover .go{letter-spacing:.06em;color:#E6CF9C}
.mq{display:flex;width:max-content;animation:mq 48s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.dr{animation:dr .55s cubic-bezier(.2,.75,.2,1) both}
@keyframes dr{from{transform:translateX(100%)}to{transform:none}}
.mi{animation:lnUp .8s cubic-bezier(.2,.75,.1,1) both}
.gl{transition:opacity .9s ease,transform 6s ease}
.ul{background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .45s ease}
.ul:hover,.ul:focus-visible{background-size:100% 1px}
.btn{transition:background-color .35s ease,color .35s ease,transform .35s ease}
.btn:hover{transform:translateY(-2px)}
.pnl{position:sticky;top:0;height:min(100svh,920px);min-height:640px;overflow:hidden;display:flex;align-items:center;box-shadow:0 -24px 60px rgba(0,0,0,.28)}
.pnl-in{position:relative;z-index:2;width:100%;max-width:1360px;margin:0 auto;padding:96px clamp(20px,4vw,48px) 48px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:center}
.pnl-vis{position:relative;height:min(68svh,640px);min-height:380px}
.discw{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end}
.disc{width:min(100%,640px);max-height:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;animation:spinIdle 90s linear infinite}
.slw{position:absolute;left:-6%;bottom:0;width:min(80%,600px);animation:flt 6s ease-in-out infinite}
.slc{display:block;width:100%;height:auto;filter:drop-shadow(0 36px 36px rgba(0,0,0,.45))}
.stk{position:absolute;right:2%;top:2%;width:128px;height:128px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box;font-size:15px;line-height:1.15;transform:rotate(-12deg);box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:3}
.stk::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1px dashed currentColor;opacity:.6;animation:spinIdle 16s linear infinite}
.bigw{position:absolute;left:-1%;bottom:-.2em;z-index:1;font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(140px,21vw,340px);line-height:1;white-space:nowrap;color:transparent;pointer-events:none}
@keyframes spinIdle{to{transform:rotate(360deg)}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes spin{from{transform:rotate(-60deg) scale(.86)}to{transform:rotate(30deg) scale(1)}}
@keyframes rise{from{transform:translate(-40px,90px) rotate(-8deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(14%)}to{transform:translateX(-6%)}}
@supports (animation-timeline: view()){
.disc{animation:spin linear both;animation-timeline:view();animation-range:entry 0% cover 50%}
.slc{animation:rise linear both;animation-timeline:view();animation-range:entry 10% cover 45%}
.bigw{animation:slide linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
}
@media (max-width: 820px){
.pnl{position:relative;height:auto;min-height:0}
.pnl-in{grid-template-columns:minmax(0,1fr);padding:72px 20px 56px;gap:8px}
.pnl-vis{order:-1;height:330px;min-height:0}
.discw{justify-content:center}
.disc{width:300px}
.slw{left:0;width:84%}
.stk{width:104px;height:104px;font-size:13px;padding:16px}
}
.nav-d{display:flex}
.burger{display:none}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width: 1020px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width: 900px){.nav-d{display:none}.burger{display:inline-flex}}
@media (max-width: 720px){.g2{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
:focus-visible{outline:2px solid #E6CF9C;outline-offset:3px}
